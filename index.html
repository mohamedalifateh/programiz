<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Python Compiler (Interpreter) - Programiz</title>
  <meta name="description" content="Write and run Python code online using this interactive compiler.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#1a1f2e;color:#c9d1d9;}
    button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit;}

    .app{display:flex;flex-direction:column;height:100vh;width:100vw;}

    /* === HEADER === */
    .header{display:flex;align-items:center;justify-content:space-between;height:68px;min-height:68px;background:#1e2235;padding:0 20px 0 20px;position:relative;z-index:100;}
    .header-left{display:flex;flex-direction:column;gap:1px;}
    .header-logo{font-size:20px;font-weight:700;color:#fff;letter-spacing:0.2px;line-height:1.3;}
    .header-logo .p-letter{font-style:italic;}
    .header-subtitle{font-size:11px;color:#7c8496;font-weight:400;line-height:1.2;}

    /* Ad Banner (center) */
    .ad-banner{display:flex;align-items:center;background:#f5f0e6;border-radius:4px;padding:6px 16px;gap:14px;height:48px;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
    .ad-image{height:40px;width:64px;border-radius:3px;flex-shrink:0;overflow:hidden;background:#1a1a2e;}
    .ad-text-wrap{display:flex;flex-direction:column;gap:0;}
    .ad-headline{font-size:13px;font-weight:700;color:#1a1a1a;}
    .ad-subtext{font-size:10px;color:#555;line-height:1.3;}
    .ad-cta{padding:5px 14px;background:#1a73e8;color:#fff;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;}
    .ad-brand{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin-left:4px;}
    .ad-brand-name{font-size:15px;font-weight:700;color:#e60012;line-height:1.2;}
    .ad-brand-product{font-size:10px;color:#222;font-weight:600;line-height:1.2;}
    .ad-close-btn{position:absolute;top:1px;right:4px;font-size:9px;color:#aaa;cursor:pointer;background:none;border:none;padding:2px;}
    .ad-info{position:absolute;top:1px;left:4px;font-size:8px;color:#aaa;display:flex;align-items:center;gap:2px;}

    .pro-btn{display:flex;align-items:center;gap:4px;padding:8px 16px;border:1px solid #474d56;border-radius:8px;color:#fff;font-size:13px;font-weight:600;background:transparent;transition:background .2s;}
    .pro-btn:hover{background:#21262d;}

    /* Discrete code buttons */
    .header-right{display:flex;align-items:center;gap:6px;}
    .code-paste-btn{width:22px;height:22px;border-radius:4px;background:rgba(255,255,255,0.06);color:#4a5068;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:background .15s,color .15s;}
    .code-paste-btn:hover{background:rgba(255,255,255,0.12);color:#8b949e;}

    /* === MAIN BODY === */
    .main-body{display:flex;flex:1;overflow:hidden;}

    /* === SIDEBAR === */
    .sidebar{width:48px;min-width:48px;background:#1e2235;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:0;overflow-y:auto;scrollbar-width:none;border-right:1px solid rgba(255,255,255,0.05);}
    .sidebar::-webkit-scrollbar{display:none;}
    .sidebar-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;flex-shrink:0;margin:1px 0;}
    .sidebar-icon:hover{background:rgba(255,255,255,0.08);}
    .sidebar-icon.active{background:#2563eb;}
    .sidebar-icon svg{width:20px;height:20px;}
    .sidebar-icon .il{font-size:10px;font-weight:700;color:#5c6370;user-select:none;letter-spacing:-0.3px;}
    .sidebar-icon.active .il{color:#fff;}

    /* === WORKSPACE === */
    .workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .panels-wrapper{flex:1;display:flex;overflow:hidden;border:1px solid rgba(59,130,246,0.5);box-shadow:0 0 8px rgba(59,130,246,0.15);margin:0;}

    /* === EDITOR === */
    .editor-panel{flex:1;display:flex;flex-direction:column;min-width:200px;overflow:hidden;}
    .editor-toolbar{display:flex;align-items:center;height:42px;min-height:42px;background:#1e2235;padding:0 8px 0 0;border-bottom:1px solid rgba(255,255,255,0.05);}
    .editor-tab{display:flex;align-items:center;height:100%;padding:0 18px;font-size:14px;font-weight:500;color:#c9d1d9;background:#141824;cursor:default;user-select:none;border-right:1px solid rgba(255,255,255,0.05);}
    .toolbar-spacer{flex:1;}
    .toolbar-actions{display:flex;align-items:center;gap:2px;}
    .toolbar-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;color:#7c8496;transition:background .15s,color .15s;}
    .toolbar-btn:hover{background:rgba(255,255,255,0.06);color:#c9d1d9;}
    .toolbar-btn svg{width:17px;height:17px;}
    .share-btn{display:flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:6px;color:#c9d1d9;font-size:14px;font-weight:500;transition:background .15s;}
    .share-btn:hover{background:rgba(255,255,255,0.06);}
    .share-btn svg{width:15px;height:15px;}
    .run-btn{display:flex;align-items:center;justify-content:center;padding:0 22px;height:32px;border-radius:7px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;transition:background .15s;margin-left:6px;}
    .run-btn:hover{background:#1d4ed8;}

    /* Editor Content */
    .editor-content{flex:1;display:flex;overflow:auto;background:#141824;}
    .line-numbers{padding:14px 0;text-align:right;user-select:none;color:#4a5068;font-family:'Source Code Pro',monospace;font-size:14px;line-height:21px;min-width:40px;padding-right:12px;padding-left:14px;background:#141824;flex-shrink:0;}
    .line-numbers .ln{display:block;}
    .code-editor-wrapper{flex:1;position:relative;overflow:auto;}
    .code-highlight{padding:14px 14px 14px 0;font-family:'Source Code Pro',monospace;font-size:14px;line-height:21px;color:#c9d1d9;white-space:pre;pointer-events:none;position:absolute;top:0;left:0;right:0;bottom:0;}
    .code-textarea{width:100%;height:100%;padding:14px 14px 14px 0;font-family:'Source Code Pro',monospace;font-size:14px;line-height:21px;color:transparent;caret-color:#c9d1d9;background:transparent;border:none;outline:none;resize:none;white-space:pre;tab-size:4;position:relative;z-index:1;overflow:auto;}

    /* Syntax Colors — matched to original */
    .s-cmt{color:#5c6370;}
    .s-kw{color:#c678dd;}
    .s-str{color:#98c379;}
    .s-bi{color:#c678dd;}
    .s-num{color:#d19a66;}
    .s-op{color:#56b6c2;}
    .s-fn{color:#61afef;}

    /* === DIVIDER === */
    .divider{width:3px;cursor:col-resize;background:rgba(255,255,255,0.05);flex-shrink:0;transition:background .15s;z-index:10;}
    .divider:hover,.divider.dragging{background:#2563eb;}

    /* === OUTPUT === */
    .output-panel{width:45%;min-width:200px;display:flex;flex-direction:column;overflow:hidden;}
    .output-toolbar{display:flex;align-items:center;justify-content:space-between;height:42px;min-height:42px;background:#1e2235;padding:0 14px;border-bottom:1px solid rgba(255,255,255,0.05);}
    .output-title{font-size:14px;font-weight:500;color:#c9d1d9;}
    .clear-btn{display:flex;align-items:center;padding:5px 16px;border:1px solid #3d4251;border-radius:6px;color:#c9d1d9;font-size:12px;font-weight:500;background:transparent;transition:background .15s;}
    .clear-btn:hover{background:rgba(255,255,255,0.05);}
    .output-content{flex:1;padding:14px 16px;font-family:'Source Code Pro',monospace;font-size:14px;line-height:21px;color:#c9d1d9;background:#141824;overflow:auto;white-space:pre-wrap;word-break:break-word;}
    .output-grip{height:18px;display:flex;align-items:center;justify-content:center;background:#141824;}
    .output-grip-bar{width:36px;height:3px;border-radius:2px;background:#3d4251;}

    /* Scrollbar */
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-track{background:#141824;}
    ::-webkit-scrollbar-thumb{background:#2d3344;border-radius:4px;}
    ::-webkit-scrollbar-thumb:hover{background:#3d4251;}
  </style>
</head>

  <script>
    // Syntax highlighting only (no backend execution)
    const textarea = document.getElementById('code-textarea');
    const highlight = document.getElementById('code-highlight');
    const lineNums = document.getElementById('line-numbers');

    function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    function hlLine(line){
      let r='',i=0;
      while(i<line.length){
        if(line[i]==='"'||line[i]==="'"){
          const q=line[i];let e=line.indexOf(q,i+1);if(e===-1)e=line.length-1;
          r+=`<span class="s-str">${esc(line.substring(i,e+1))}</span>`;i=e+1;
        }else if(line[i]==='#'){
          r+=`<span class="s-cmt">${esc(line.substring(i))}</span>`;break;
        }else if(/[a-zA-Z_]/.test(line[i])){
          let w='';while(i<line.length&&/\w/.test(line[i]))w+=line[i++];
          const kw=['and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield','True','False','None','self'];
          const bi=['print','input','len','range','int','str','float','list','dict','tuple','set','bool','type','isinstance','enumerate','zip','map','filter','sorted','reversed','abs','max','min','sum','open','super','format'];
          if(kw.includes(w))r+=`<span class="s-kw">${w}</span>`;
          else if(bi.includes(w)&&i<line.length&&line[i]==='(')r+=`<span class="s-bi">${w}</span>`;
          else r+=esc(w);
        }else if(/\d/.test(line[i])){
          let n='';while(i<line.length&&/[\d.]/.test(line[i]))n+=line[i++];
          r+=`<span class="s-num">${n}</span>`;
        }else if('=+-*/<>!&|%^~'.includes(line[i])){
          r+=`<span class="s-op">${esc(line[i])}</span>`;i++;
        }else{r+=esc(line[i]);i++;}
      }
      return r;
    }

    function updateHL(){
      highlight.innerHTML=textarea.value.split('\n').map(l=>
        l.trimStart().startsWith('#')?`<span class="s-cmt">${esc(l)}</span>`:hlLine(l)
      ).join('\n');
    }
    function updateLN(){
      const n=textarea.value.split('\n').length;
      lineNums.innerHTML=Array.from({length:n},(_,i)=>`<span class="ln">${i+1}</span>`).join('');
    }
    function sync(){highlight.scrollTop=textarea.scrollTop;highlight.scrollLeft=textarea.scrollLeft;lineNums.scrollTop=textarea.scrollTop;}

    updateHL();updateLN();
    textarea.addEventListener('input',()=>{updateHL();updateLN();});
    textarea.addEventListener('scroll',sync);
    textarea.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();const s=textarea.selectionStart;textarea.value=textarea.value.substring(0,s)+'    '+textarea.value.substring(textarea.selectionEnd);textarea.selectionStart=textarea.selectionEnd=s+4;updateHL();updateLN();}
    });

    // Clear button
    document.getElementById('clear-btn').addEventListener('click',()=>{document.getElementById('output-content').textContent='';});

    // Resize divider
    let dragging=false;const divider=document.getElementById('divider');const ep=document.getElementById('editor-panel');const op=document.getElementById('output-panel');
    divider.addEventListener('mousedown',e=>{dragging=true;divider.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});
    document.addEventListener('mousemove',e=>{if(!dragging)return;const c=document.querySelector('.panels-wrapper').getBoundingClientRect();const x=e.clientX-c.left;const ew=Math.max(200,Math.min(x,c.width-200));ep.style.flex='none';ep.style.width=ew+'px';op.style.flex='none';op.style.width=(c.width-ew-3)+'px';});
    document.addEventListener('mouseup',()=>{if(dragging){dragging=false;divider.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';}});

    // Sidebar active toggle
    document.querySelectorAll('.sidebar-icon').forEach(icon=>{icon.addEventListener('click',()=>{document.querySelectorAll('.sidebar-icon').forEach(i=>i.classList.remove('active'));icon.classList.add('active');});});

    // Code paste buttons
    const code4 = `# Simple Shift Reduce Parser\n\nstack = []\ninput_string = input("Enter input string (end with $): ")\n\n# Example grammar: S -> aSb | ab\n# Valid strings: ab, aabb, aaabbb...\n\ndef check_reduce():\n    global stack\n    # Reduce "ab" to S\n    if len(stack) >= 2 and stack[-2:] == ['a', 'b']:\n        stack = stack[:-2]\n        stack.append('S')\n        print("Reduce: ab -> S")\n\n    # Reduce "aSb" to S\n    if len(stack) >= 3 and stack[-3:] == ['a', 'S', 'b']:\n        stack = stack[:-3]\n        stack.append('S')\n        print("Reduce: aSb -> S")\n\n\ni = 0\nwhile i < len(input_string):\n    # Shift\n    print("Shift:", input_string[i])\n    stack.append(input_string[i])\n    print("Stack:", stack)\n\n    # Try reduce\n    check_reduce()\n\n    i += 1\n\n# Final check\nif stack == ['S', '$'] or stack == ['S']:\n    print("String Accepted")\nelse:\n    print("String Rejected")`;

    const code5 = `# Three Address Code Generator\n\nexpression = input("Enter expression (like a+b*c): ")\n\ntemp_count = 1\nstack = []\n\n# Operator precedence\npriority = {'+':1, '-':1, '*':2, '/':2}\n\noperators = []\noutput = []\n\n# Convert infix to postfix (simple)\nfor ch in expression:\n    if ch.isalnum():\n        output.append(ch)\n    else:\n        while operators and priority.get(ch,0) <= priority.get(operators[-1],0):\n            output.append(operators.pop())\n        operators.append(ch)\n\nwhile operators:\n    output.append(operators.pop())\n\n# Generate 3-address code\nfor ch in output:\n    if ch.isalnum():\n        stack.append(ch)\n    else:\n        op2 = stack.pop()\n        op1 = stack.pop()\n        temp = "T" + str(temp_count)\n        print(temp, "=", op1, ch, op2)\n        stack.append(temp)\n        temp_count += 1`;

    function loadCode(code) {
      textarea.value = code;
      updateHL();
      updateLN();
    }
    document.getElementById('paste-4').addEventListener('click', () => loadCode(code4));
    document.getElementById('paste-5').addEventListener('click', () => loadCode(code5));
  </script>
</body>
</html>
